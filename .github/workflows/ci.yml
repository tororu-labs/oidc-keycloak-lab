name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  demo_api:
    name: demo_api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/demo_api/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy .
      - name: Test
        run: pytest tests/

  demo_bff:
    name: demo_bff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo_bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/demo_bff/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy .
      - name: Test
        run: pytest tests/
